name: Хочется, чтобы умело
description: Идея или пожелание
labels: ["идея"]
body:
  - type: markdown
    attributes:
      value: |
        «Рядом» — чат для двух-трёх машин в одной квартире. Всё, что
        тянет за собой сервер, аккаунты или интернет, скорее всего не
        подойдёт — но написать всё равно стоит.

  - type: textarea
    id: chto
    attributes:
      label: Что хочется
      placeholder: Чтобы при звонке можно было приглушить свой микрофон одной клавишей.
    validations:
      required: true

  - type: textarea
    id: zachem
    attributes:
      label: Зачем — какой случай из жизни
      description: Важнее самой идеи: по случаю понятно, что вы на самом деле решаете.
      placeholder: Играем в наушниках, ребёнок заходит в комнату — надо мгновенно замолчать, а мышь занята.
    validations:
      required: false
